version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 2
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
